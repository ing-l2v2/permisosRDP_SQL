<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<title>Solicitudes Autorizadas 20260417</title>
<link rel='stylesheet' href='css/rdp.css'>
<script src='js/rdp.js'></script>
</head>

<body>

<h2>Solicitudes Autorizadas - 20260417.</h2>

<input type='text' id='txtFiltro' placeholder='Buscar en todo el reporte...'>

<!--  div class="contenedor-tabla" -->
<table class="table table-sm table-fixed" id="tabla">
<thead>
<tr><th class='fixed-col'>NRO</th><th class='fixed-col'>SERVIDOR</th><th class='fixed-col'>BD</th><th class='fixed-col'>USR</th><th class='fixed-col'>FFIN</th><th class='fixed-col'>COD_USER</th><th class='fixed-col'>ESTADO</th><th class='fixed-col'>PERMISO</th><th class='fixed-col'>DOM</th><th class='fixed-col'>RDP</th><th class='fixed-col'>SQL</th><th class='fixed-col'>ADM</th><th class='fixed-col'>r</th><th class='fixed-col'>w</th><th class='fixed-col'>rw</th><th class='fixed-col'>sp</th><th class='fixed-col'>rwsp</th><th class='fixed-col'>sm</th><th class='fixed-col'>rwsm</th><th class='fixed-col'>job</th><th class='fixed-col'>sysad</th><th class='fixed-col'>prf</th><th class='fixed-col'>own</th><th class='fixed-col'>ath</th><th>Accion</th>
</tr></thead><tbody></tbody>
</table>
<!--  /div -->

<!--button class='btn' onclick='generarComandos()'>Generar Comandos</button-->
<div style='margin-top:15px;'>
    <button id='btnGenerar' onclick='generarTodo()' class='btn'>Generar Comandos</button>
</div>

<div style='margin-top:15px;'>
  <p><strong>Informe generado en: </strong> <span id='totalProceso'>00:00:00</span></p><br><br>
</div>

<!-- MODAL PARA MOSTRAR COMANDOS -->
<div id="cmdModal" class="modal" style="display:none;
     position:fixed;top:0;left:0;width:100%;height:100%;
     background:rgba(0,0,0,0.6);padding-top:70px;z-index:9999;">
  
  <div class="modal-content" style="background:white;margin:auto;
       padding:20px;border-radius:8px;width:50%;position:relative;">
    
    <span id="closeModal" 
          style="position:absolute;top:10px;right:15px;
                 font-size:22px;cursor:pointer;">&times;</span>

    <h3>Comandos generados</h3>

    <textarea id="cmdContent" readonly 
              style="width:100%;height:120px;margin-top:10px;"></textarea>

    <button id="copyBtn" class="miniBtn" 
            style="margin-top:15px;padding:8px 15px;">
        Copiar
    </button>
  </div>
</div>


</body>
</html>
